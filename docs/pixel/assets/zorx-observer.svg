<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" role="img" aria-labelledby="title desc">
<title id="title">ZORX — curious guardian kitten</title><desc id="desc">Seated monochrome kitten with a Z scarf and aviator goggles. Both front paws rest naturally. Its large eyes follow the pointer and its ears twitch occasionally when motion is enabled.</desc>
<style>
#tail{transform-box:view-box;transform-origin:185px 490px;animation:zorx-tail 4.2s ease-in-out infinite}
@keyframes zorx-tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
#ear-left{transform-box:view-box;transform-origin:220px 215px}
#ear-right{transform-box:view-box;transform-origin:420px 212px}
@media(prefers-reduced-motion:reduce){#tail{animation:none!important}}
</style>
