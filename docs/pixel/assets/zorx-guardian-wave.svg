<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" role="img" aria-labelledby="title desc">
<title id="title">ZORX — the little guardian</title><desc id="desc">An adorable but determined black and white fluffy kitten wearing aviator goggles, Z headphones and a black Z scarf, waving one paw hello.</desc>
<style>
#wave-arm{transform-box:view-box;transform-origin:418px 409px;animation:zorx-wave 3.8s ease-in-out infinite}
#tail{transform-box:view-box;transform-origin:185px 490px;animation:zorx-tail 4.2s ease-in-out infinite}
#cat-blink{transform-box:fill-box;transform-origin:center;animation:zorx-blink 7s infinite}
@keyframes zorx-wave{0%,12%,48%,100%{transform:rotate(0deg)}21%,36%{transform:rotate(-19deg)}29%,43%{transform:rotate(13deg)}}
@keyframes zorx-tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes zorx-blink{0%,92%,96%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){#wave-arm,#tail,#cat-blink{animation:none!important}}
</style>
